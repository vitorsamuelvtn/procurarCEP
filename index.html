<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar CEP</title>
    <style>

            .titulo1 img {
                width: 80px;
                height: 80px;
            }
        
            .tudo {
                width: 300px;
                height: 300px;
                background-color: rgb(92, 136, 115);
                border-radius: 10px;
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
                position: relative;
                left: 450px;
                top: 210px;
            }

            .titulo1 h1 {
                font-size: 30px;
                position: relative;
                top: 20px;
            }

            body {
                background-color: rgb(92, 136, 115);
            }

            .input input {
                border-radius: 10px;
                border: solid;
               border-color: aliceblue;
            }

            .input button {
                background-color: rgb(147, 185, 185);
                border-radius: 10px;
                border: solid;
                border-color: rgb(147, 185, 185);
                padding: 3px;
                
            }

            .input button:hover {
                background-color: rgb(19, 39, 39);
                border-color: rgb(19, 39, 39);
            }

    </style>
</head>
    <body>

    <div class="tudo">

        <div class="titulo1">

            <h1>Consulta CEP</h1>
            <img src="location-162102_640.png" alt="foto titulo">

        </div>

        <div class="input">
            <input type="text" id="cep" name="cep" placeholder="Digite seu CEP...">
             <button onclick="buscarCep()">Buscar</button>

        </div>

        <div id="area-card">

        </div>

    </div>

    <script>
var dadosCepJson;
var cep;

async function buscarCep() {

    cep = document.querySelector('#cep').value;

    console.log(cep);

    await fetch(`https://viacep.com.br/ws/${cep}/json/`)
        .then(response => response.json())
        .then(dados => {
            dadosCepJson = dados;
            console.log(dadosCepJson);
        })
        .catch(error => {
            console.error('Erro ao buscar o CEP:', error);
        });

    if (dadosCepJson) {

        document.querySelector('#area-card').innerHTML += `
            <div class="card">
                <h2>CEP: ${dadosCepJson.cep}</h2>
                <p>Logradouro: ${dadosCepJson.logradouro}</p>
                <p>Complemento: ${dadosCepJson.complemento}</p>
                <p>Bairro: ${dadosCepJson.bairro}</p>
                <p>Cidade: ${dadosCepJson.localidade}</p>
                <p>Estado: ${dadosCepJson.uf}</p>
            </div>`;

    } else {
        console.log('Dados do CEP não disponíveis.');
    }
}
    </script>
    
        

          
    </body>
</html>
